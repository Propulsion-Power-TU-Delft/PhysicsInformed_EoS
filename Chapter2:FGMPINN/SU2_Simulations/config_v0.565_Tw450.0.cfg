VOLUME_FILENAME = flow_v0565_Tw450
RESTART_FILENAME= restart_v0565_Tw450
CONV_FILENAME=history_v0565_Tw450

INC_VELOCITY_INIT= (0.0, 1.13, 0.0)
MARKER_INLET=(inlet, 300, 0.565 ,0,1,0)
MARKER_ISOTHERMAL=(wall, 450)

%
% ---------------- INCOMPRESSIBLE FLOW CONDITION DEFINITION -------------------%
%
SOLVER = INC_NAVIER_STOKES
INC_DENSITY_MODEL= VARIABLE
INC_ENERGY_EQUATION = YES
INC_DENSITY_INIT= 1.00
INC_TEMPERATURE_INIT= 300
INC_NONDIM= DIMENSIONAL

% -------------------- FLUID MODEL --------------------------------------- %
%
FLUID_MODEL= FLUID_FLAMELET
INTERPOLATION_METHOD= MLP
FILENAMES_INTERPOLATOR= (MLP_Group_1.mlp,MLP_Group_2.mlp,MLP_Group_3.mlp,MLP_Group_4.mlp,MLP_Group_5.mlp,MLP_Group_6.mlp,MLP_Group_7.mlp,MLP_Group_8.mlp,MLP_Group_9.mlp,MLP_Group_10.mlp,MLP_Group_11.mlp,MLP_Group_NULL.mlp)
% FGM controlling variable names (must include mixture fraction for partial 
% premixed cases)
CONTROLLING_VARIABLE_NAMES=(ProgressVariable,EnthalpyTot,MixtureFraction)
LOOKUP_NAMES=(ProdRateTot_PV)
CONTROLLING_VARIABLE_SOURCE_NAMES=(ProdRateTot_PV,NULL,NULL)
% -------------------- SCALAR TRANSPORT ---------------------------------------%
%
KIND_SCALAR_MODEL= FLAMELET      
DIFFUSIVITY_MODEL= FLAMELET
VISCOSITY_MODEL= FLAMELET
CONDUCTIVITY_MODEL= FLAMELET

CUSTOM_OUTPUTS= 'avgp_inlet : AreaAvg{PRESSURE}[inlet]'
CUSTOM_OBJFUNC= 'avgp_inlet'

OBJECTIVE_FUNCTION= CUSTOM_OBJFUNC
PREFERENTIAL_DIFFUSION=YES
FLAME_INIT_METHOD= SPARK
SPARK_INIT= (0.00, 0.004, 0, 1e-4, 100, 10)
SPARK_REACTION_RATES=(2000, 0, 0)

CONV_NUM_METHOD_SPECIES= BOUNDED_SCALAR

MUSCL_SPECIES= YES
TIME_DISCRE_SPECIES= EULER_IMPLICIT
SPECIES_CLIPPING= NO
SPECIES_INIT=(-2.1906554250272275e-01,+2.2629126205690527e+03,+1.4467517838966191e-02)
MARKER_INLET_SPECIES = (inlet, -2.1906554250272275e-01,+2.2629126205690527e+03,+1.4467517838966191e-02)


INC_INLET_TYPE= VELOCITY_INLET
CFL_REDUCTION_SPECIES= 1.0
% 
% ---------------------- REFERENCE VALUE DEFINITION ---------------------------%
%
REF_ORIGIN_MOMENT_X = 0.25
REF_ORIGIN_MOMENT_Y = 0.00
REF_ORIGIN_MOMENT_Z = 0.00
REF_LENGTH= 1.0
REF_AREA= 1.0
%
% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
%

MARKER_EULER=(sides)

INC_OUTLET_TYPE= PRESSURE_OUTLET
INC_INLET_DAMPING = 0.05
INC_OUTLET_DAMPING = 0.05
MARKER_OUTLET= (outlet, 0.0)
%
% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%
%
NUM_METHOD_GRAD= GREEN_GAUSS
CFL_NUMBER= 100
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.99, 1.01, 10.0, 200, 1e-4, 100)
INNER_ITER= 10000
%
% ------------------------ LINEAR SOLVER DEFINITION ---------------------------%
%
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= LU_SGS
LINEAR_SOLVER_ERROR= 1E-04
LINEAR_SOLVER_ITER= 15
%
% -------------------------- MULTIGRID PARAMETERS -----------------------------%
%
MGLEVEL= 0
%
% -------------------- FLOW NUMERICAL METHOD DEFINITION -----------------------%
%
CONV_NUM_METHOD_FLOW= FDS
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW = NONE
TIME_DISCRE_FLOW= EULER_IMPLICIT
%
% --------------------------- CONVERGENCE PARAMETERS --------------------------%
%
CONV_RESIDUAL_MINVAL= -15
CONV_STARTITER= 10
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-6
OUTPUT_WRT_FREQ= 20
SCREEN_OUTPUT = INNER_ITER RMS_RES CUSTOM LINSOL
HISTORY_OUTPUT = RMS_RES CUSTOM CFL_NUMBER
VOLUME_OUTPUT = SOLUTION RESIDUAL SENSITIVITY PRIMITIVE SOURCE MESH_QUALITY
CONV_FIELD = RMS_ProgressVariable RMS_EnthalpyTot RMS_MixtureFraction
WRT_ZONE_HIST= YES
%
% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
%
OUTPUT_PRECISION= 16
TABULAR_FORMAT = CSV
RESTART_SOL=NO
MESH_FORMAT=SU2
MESH_FILENAME= Mesh/su2mesh.su2


WRT_PERFORMANCE = NO 
SCREEN_WRT_FREQ_INNER = 1
SCREEN_WRT_FREQ_OUTER = 1


SLOPE_LIMITER_SPECIES = VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.02
OUTPUT_FILES=(RESTART, PARAVIEW_MULTIBLOCK)

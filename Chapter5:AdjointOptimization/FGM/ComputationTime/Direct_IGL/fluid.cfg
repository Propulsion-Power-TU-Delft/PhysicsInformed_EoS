%
% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
%
SOLVER = INC_NAVIER_STOKES
KIND_TURB_MODEL= NONE
%
% ---------------- INCOMPRESSIBLE FLOW CONDITION DEFINITION -------------------%
%
INC_DENSITY_MODEL= VARIABLE
INC_ENERGY_EQUATION = YES
INC_DENSITY_INIT= 1.00
INC_VELOCITY_INIT= (1.13, 0.0, 0.0 )
INC_TEMPERATURE_INIT= 300.0
INC_NONDIM= DIMENSIONAL
%
% -------------------- FLUID MODEL --------------------------------------- %
%
FLUID_MODEL= INC_IDEAL_GAS
MARKER_INLET = (inlet_center, 300.000, 5.4356638740841801e-01, 1.0, 0.0, 0.0, inlet_cocenter, 300.000, 4.8500504116301080e-01, 1.0, 0.0, 0.0)

% ---------------------- REFERENCE VALUE DEFINITION -------------------- -------%
%
REF_ORIGIN_MOMENT_X = 0.25
REF_ORIGIN_MOMENT_Y = 0.00
REF_ORIGIN_MOMENT_Z = 0.00
REF_LENGTH= 1.0
REF_AREA= 1.0
%
% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%

MARKER_SYM= (symmetry)
INC_INLET_TYPE= VELOCITY_INLET,VELOCITY_INLET
INC_OUTLET_TYPE= PRESSURE_OUTLET
INC_INLET_DAMPING = 0.05
INC_OUTLET_DAMPING = 0.05
MARKER_OUTLET= (outlet, 0.0)
%
% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%
%
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CFL_NUMBER= 30
%__ADJOINT__CFL_NUMBER= 10
%__ADJOINT__CFL_ADAPT= YES
CFL_ADAPT=NO
CFL_ADAPT_PARAM= ( 0.99, 1.01, 1.0, 100.0)
INNER_ITER= 1
%
% ------------------------ LINEAR SOLVER DEFINITION ---------------------------%
%
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR=1e-3
LINEAR_SOLVER_ITER= 40
%
% -------------------------- MULTIGRID PARAMETERS -----------------------------%
%
MGLEVEL= 0
%
% -------------------- FLOW NUMERICAL METHOD DEFINITION -----------------------%
%
CONV_NUM_METHOD_FLOW= FDS
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW = NONE
TIME_DISCRE_FLOW= EULER_IMPLICIT
%
% --------------------------- CONVERGENCE PARAMETERS --------------------------%
%

CONV_STARTITER= 10
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-6
SCREEN_OUTPUT = INNER_ITER RMS_VELOCITY-X RMS_VELOCITY-Y RMS_PRESSURE CUSTOM LINSOL
%__ADJOINT__SCREEN_OUTPUT = INNER_ITER RMS_ADJ_VELOCITY-X RMS_ADJ_VELOCITY-Y RMS_ADJ_PRESSURE RMS_ADJ_ProgressVariable RMS_ADJ_EnthalpyTot RMS_ADJ_MixtureFraction
HISTORY_OUTPUT = WALL_TIME RMS_RES DRAG LINSOL CUSTOM
%__ADJOINT__HISTORY_OUTPUT = RMS_RES
VOLUME_OUTPUT = SOLUTION PRIMITIVE SOURCE RESIDUAL SENSITIVITY

WRT_ZONE_HIST= YES
%
% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
%
OUTPUT_PRECISION= 16
CONV_FILENAME= history_fluid
%__ADJOINT__CONV_FILENAME= history_adj_fluid
WRT_PERFORMANCE = NO 
READ_BINARY_RESTART=YES

CUSTOM_OUTPUTS= 'avg_temp_outlet : AreaAvg{TEMPERATURE}[outlet];\
                 avg_temp_outlet_scaled : Function{avg_temp_outlet / 764.5112284716569};\
                 avg_p_center_inlet : AreaAvg{PRESSURE}[inlet_center];\
                 avg_p_cocenter_inlet : AreaAvg{PRESSURE}[inlet_cocenter];\
                 avg_p_inlet : Function{0.5 * avg_p_center_inlet + 0.5 * avg_p_cocenter_inlet};\
                 avg_p_inlet_scaled : Function{avg_p_inlet / 4.36284286862725}'
CUSTOM_OBJFUNC= 'avg_p_inlet'